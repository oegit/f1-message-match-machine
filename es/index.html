</section>

  </main>

<!-- Micro-animations (progressive enhancement, owner request 2026-09-04; hero entrance only
     since the 2026-09-07 hero-only cut — the reveal/count-up blocks left with their sections).
     Vanilla JS +
     IntersectionObserver, no libraries. Bails out entirely under prefers-reduced-motion,
     so the no-JS / reduced-motion page is the static design. All motion is
     transform/opacity only (no reflow → no CLS); the hero animates transform-only so
     the LCP image stays painted. Rules live in the "Micro-animations" block of
     components.css. -->
<script>
(function () {
  var root = document.documentElement;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  root.classList.add('js-anim');
  var reveals = [];
  function reveal(el, delay) {
    if (!el) return;
    el.classList.add('anim');
    if (delay) el.style.setProperty('--d', delay.toFixed(2) + 's');
    reveals.push(el);
  }
  // E — hero entrance: the three columns rise (transform only, above the fold)
  document.querySelectorAll('.s-hero__col').forEach(function (el, i) {
    el.classList.add('anim-hero');
    el.style.setProperty('--d', (i * 0.1).toFixed(2) + 's');
    reveals.push(el);
  });
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
  reveals.forEach(function (el) { io.observe(el); });

})();
</script>
</body>
</html>
